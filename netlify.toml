[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# The app is a client-side router (React Router). Without this rewrite a direct
# request to /campus, /simulation, /optimizer, ... returns Netlify's 404 page
# instead of index.html, which looks like the site is broken.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Production React build targets the live Render backend. This is the only
  # host-side variable the frontend build needs. The backend key, database URL
  # and any other backend secret stay on Render and are never sent to Netlify.
  VITE_API_BASE = "https://mirrorworld.onrender.com"
